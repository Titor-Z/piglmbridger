name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "npm publish --dry-run only"
        type: boolean
        default: false
  push:
    tags:
      - "npm-v*"

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/npm-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pi-glmbridger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install dev deps & type-check
        run: npm install --no-save @types/node @earendil-works/pi-coding-agent typescript && npx tsc --noEmit
      - name: Publish
        run: npm publish ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
